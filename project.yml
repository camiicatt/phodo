# phodo — Xcode project definition.
# The .xcodeproj is generated from this file, so edit this (not the project) and run:
#   xcodegen generate
name: phodo
options:
  bundleIdPrefix: app.phodo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: PRRWSX8GBA  # Camille Rivera (Individual, paid developer program)
    CODE_SIGN_STYLE: Automatic
targets:
  phodo:
    type: application
    platform: iOS
    sources:
      - path: phodo
    dependencies:
      - package: Supabase
    info:
      path: phodo/Info.plist
      properties:
        CFBundleDisplayName: phodo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBg   # lavender, so the cat intro starts on the same color
        ITSAppUsesNonExemptEncryption: false   # only standard HTTPS, skips the export question on upload
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "so you can snap today's pic."
        NSPhotoLibraryAddUsageDescription: "so pics you take in phodo also land in your Photos."
        CFBundleURLTypes:
          - CFBundleURLName: app.phodo
            CFBundleURLSchemes: [phodo]          # phodo://login-callback (email sign-in links)
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseKey: $(SUPABASE_KEY)
        UIAppFonts:
          - BricolageGrotesque.ttf
          - DMMono-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.phodo   # reverse of phodo.app; permanent once you upload a build
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: phodo/phodo.entitlements   # push notifications
  phodoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: phodoTests
    dependencies:
      - target: phodo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  phodo:
    build:
      targets:
        phodo: all
    test:
      targets:
        - phodoTests
